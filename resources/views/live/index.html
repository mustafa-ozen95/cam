<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="tema-alan" content="">
  <title>Kameralar</title>
  <!-- Tasarim panelle ayni (EYS): yazi tipleri + bilesenler panelin kendi dosyalari; live.css yalniz yerlesimi ekler -->
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/eys/app.css">
  <link rel="stylesheet" href="live.css">
  <script type="module" src="tema.mjs"></script>
</head>
<body>
  <!-- Ust serit yalniz admin oturumunda; digerleri yalniz kameralari gorur -->
  <header class="ust" id="ust" hidden>
    <strong class="ust__ad">Kameralar</strong>
    <span class="ust__bilgi" id="bilgi"></span>
    <label class="ust__alan" id="sutunAlan" hidden><span>Sütun</span>
      <select class="select" id="sutun"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
    </label>
    <button type="button" class="btn btn--sm btn--primary" id="kaydet" hidden>Kaydet</button>
    <button type="button" class="btn btn--sm" id="vazgec" hidden>Vazgeç</button>
    <button type="button" class="btn btn--ghost btn--icon btn--sm" data-theme-toggle aria-label="Temayı değiştir" title="Gece / gündüz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round" />
      </svg>
    </button>
    <button type="button" class="btn btn--sm" id="duzenle">Düzenle</button>
    <button type="button" class="btn btn--sm btn--ghost" id="tam">Tam ekran</button>
    <a class="btn btn--sm btn--ghost" href="/" title="Kamera paneline geç">Panel</a>
  </header>
  <main class="govde">
    <div class="izgara" id="izgara"></div>
    <aside class="liste" id="liste" hidden>
      <p class="liste__ipucu">Kamerayı ızgaradaki bir karenin üstüne sürükleyin (yerine geçer) ya da tıklayın (sona eklenir). Kareleri sürükleyerek yer değiştirin; × kaldırır. <strong>Kaydet</strong> deyince bu sayfayı açan herkes bu düzeni görür.</p>
      <button type="button" class="btn btn--sm btn--block" id="sifirla">Varsayılan düzene dön</button>
      <div id="listeIc"></div>
    </aside>
  </main>
  <script src="live.js"></script>
</body>
</html>
