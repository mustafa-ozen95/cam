<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tema-alan" content="">
<meta name="robots" content="noindex, nofollow">
<title>Giriş · Kamera Paneli</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/app.css">
<script type="module">
  /* Tema: EYS theme.js birebir (cerez dc-tema; paneller arasi ortak secim). */
  import * as theme from '/js/eys/components/theme.js';
  theme.init();
</script>
</head>
<body>
<!--
  GİRİŞ EKRANI EYS İLE BİREBİR AYNI DÜZENDE:
  gate__mark / gate__lead, merkez düğmesi, "veya" ayracı, katlı parola formu,
  alt not. Sınıflar ve CSS DC panellerinden; burada yalnızca işaretleme var.
  Sunucu doldurur: HUB (düğme + ayraç), HUB_ERROR, OPEN (merkez yoksa
  parola formu açık), PRIMARY (merkez yoksa "Oturum aç" birincil düğme).
-->
<button type="button" class="btn btn--ghost btn--icon btn--sm gate__tema" data-theme-toggle aria-label="Temayı değiştir">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round" />
  </svg>
</button>
<main class="gate">
  <div class="gate__panel">
    <div class="gate__mark">Kamera Paneli</div>
    <p class="gate__lead">NVR ve kamera izleme — devam etmek için oturum açın.</p>

    <!--HUB_ERROR-->
    <div class="alert alert--danger gate__alert" id="error" role="alert" hidden></div>

    <!--HUB-->

    <details class="gate__katlanir"<!--OPEN-->>
      <summary class="gate__katlanir-baslik">Parolayla giriş</summary>

      <form id="form" autocomplete="on">
        <div class="field">
          <label class="field__label" for="name">Kullanıcı adı</label>
          <input class="input input--mono" id="name" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>

        <div class="field">
          <label class="field__label" for="password">Parola</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--block<!--PRIMARY-->" id="send">Oturum aç</button>
        </div>
      </form>

      <p class="gate__foot">Hesap açma isteği için sistem yöneticisine başvurun.</p>
    </details>
  </div>
</main>
<script>
  const f = document.getElementById('form'), error = document.getElementById('error'), button = document.getElementById('send');
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); error.hidden = true; button.disabled = true;
    try {
      const y = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Cam': '1' }, body: JSON.stringify({ name: document.getElementById('name').value.trim(), password: document.getElementById('password').value }) });
      const j = await y.json().catch(() => ({}));
      if (!y.ok) throw new Error(j.error ?? `Hata ${y.status}`);
      location.reload(); // ayni adres: replace() sayfayi yenilemez, reload() yeni cerezle paneli getirir
    } catch (err) { error.textContent = err.message; error.hidden = false; button.disabled = false; document.getElementById('password').select(); }
  });
</script>
</body>
</html>
